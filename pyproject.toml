[project]
name = "django-scaffold"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-browser-reload>=1.21.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "django-storages[s3]>=1.14.6",
    "django-vite>=3.2.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "procrastinate[django]>=3.10.0",
    "psycopg>=3.3.6",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
    "typer>=0.27.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
]

[build-system]
requires = ['uv_build>=0.13.5,<0.14']
build-backend = 'uv_build'

[tool.uv.build-backend]
module-root = ""
module-name = "scripts"

[project.scripts]
scaffold = 'scripts.cli:main'